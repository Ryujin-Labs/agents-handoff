name: Release (manual)

# Local publishing is the default; pushing a branch or tag never starts this workflow.
on:
  workflow_dispatch:
    inputs:
      acknowledge_actions_cost:
        description: 'I verified Actions billing controls prevent charges for this run'
        type: boolean
        required: true
        default: false
      expected_npm_user:
        description: 'Existing npm account that owns these public packages'
        type: string
        required: true
      version:
        description: 'Exact shared package version to publish (for example 0.1.0)'
        type: string
        required: true

permissions:
  contents: read
  id-token: write # npm provenance; only used on explicit manual dispatch

concurrency:
  group: npm-public-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.acknowledge_actions_cost }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Configure git for fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: npm ci
      - name: Check and publish public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NPM_USER: ${{ inputs.expected_npm_user }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs --publish --expected-user "$EXPECTED_NPM_USER" --version "$RELEASE_VERSION" --provenance
